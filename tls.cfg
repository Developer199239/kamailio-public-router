#
# Kamailio TLS Configuration File with Let's Encrypt Certificates
# Updated: October 23, 2025
#

# ---
# Default server domain profile for c5.sandboxegytelecoms.com
# This handles the primary domain
#
[server:default]
method = TLSv1.2+
verify_certificate = no
require_certificate = no
private_key = /etc/letsencrypt/live/c5.sandboxegytelecoms.com/privkey.pem
certificate = /etc/letsencrypt/live/c5.sandboxegytelecoms.com/fullchain.pem
ca_list = /etc/letsencrypt/live/c5.sandboxegytelecoms.com/chain.pem
cipher_list = HIGH:!aNULL:!MD5:!RC4:!DES:!3DES
server_name = c5.sandboxegytelecoms.com

# ---
# Server profile for dc05.sandboxegytelecoms.com wildcard certificate
# This handles *.dc05.sandboxegytelecoms.com and dc05.sandboxegytelecoms.com
#
[server:dc05]
method = TLSv1.2+
verify_certificate = no
require_certificate = no
private_key = /etc/kamailio/certs/privkey.pem
certificate = /etc/kamailio/certs/fullchain.pem
ca_list = /etc/kamailio/certs/chain.pem
cipher_list = HIGH:!aNULL:!MD5:!RC4:!DES:!3DES
server_name = dc05.sandboxegytelecoms.com
server_name_mode = 1
server_id = dc05.sandboxegytelecoms.com

# ---
# Server profile for wildcard matching on any interface
# Matches *.dc05.sandboxegytelecoms.com domains using SNI
#
[server:any]
method = TLSv1.2+
verify_certificate = no
require_certificate = no
private_key = /etc/kamailio/certs/privkey.pem
certificate = /etc/kamailio/certs/fullchain.pem
ca_list = /etc/kamailio/certs/chain.pem
cipher_list = HIGH:!aNULL:!MD5:!RC4:!DES:!3DES
server_name = *.dc05.sandboxegytelecoms.com
server_name_mode = 1

# ---
# Default client domain profile for outgoing connections
# Used when Kamailio makes outbound TLS connections
#
[client:default]
method = TLSv1.2+
verify_certificate = no
require_certificate = no
private_key = /etc/kamailio/certs/privkey.pem
certificate = /etc/kamailio/certs/fullchain.pem
ca_list = /etc/kamailio/certs/chain.pem
cipher_list = HIGH:!aNULL:!MD5:!RC4:!DES:!3DES

