modparam("acc", "log_missed_flag", 2)
modparam("acc", "failed_transaction_flag", 3)

####### Routing Logic ########

# Main SIP request routing logic
request_route {
    
    # Per request initial checks
    route(REQINIT);

    # NAT detection
    route(NATDETECT);

    # CANCEL processing
    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            route(RELAY);
        }
        exit;
    }

    # Handle retransmissions
    if (!is_method("ACK")) {
        if(t_precheck_trans()) {
            t_check_trans();
            exit;
        }
        t_check_trans();
    }

    # Handle requests within SIP dialogs
    route(WITHINDLG);

    ### only initial requests (no To tag)

    # Record routing for dialog forming requests
    if (is_method("INVITE|SUBSCRIBE")) {
        record_route();
    }

    # Account only INVITEs
    if (is_method("INVITE")) {
        setflag(1); # do accounting
    }

    # Handle registrations
    route(REGISTRAR);

    # Check for valid destination
    if ($rU==$null) {
        sl_send_reply("484","Address Incomplete");
        exit;
    }

    # Route to Asterisk
    route(TOASTERISK);
}

# Initial request filtering
route[REQINIT] {
    # Flood protection
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483","Too Many Hops");
        exit;
    }

    # Sanity checks
    if(!sanity_check("1511", "7")) {
        xlog("L_WARN", "Malformed SIP message from $si:$sp\n");
        exit;
    }

    # OPTIONS keep-alive responses
    if(is_method("OPTIONS") && uri==myself && $rU==$null) {
        sl_send_reply("200","Keepalive");
        exit;
    }
}

# Handle requests within SIP dialogs
route[WITHINDLG] {
    if (!has_totag()) return;

    # Sequential request within a dialog
    if (loose_route()) {
        route(DLGURI);
        if (is_method("BYE")) {
            setflag(1); # do accounting
            setflag(3); # failed transaction flag
        }
        else if (is_method("ACK")) {
            # ACK is forwarded statelessy
            route(NATMANAGE);
        }
        else if (is_method("NOTIFY")) {
            # Add Record-Route for in-dialog NOTIFY
            record_route();
        }
        route(RELAY);
        exit;
    }

    if (is_method("ACK")) {
        if (t_check_trans()) {
            route(RELAY);
            exit;
        } else {
            exit;
        }
    }
    sl_send_reply("404","Not here");
    exit;
}

# Handle SIP registrations
route[REGISTRAR] {
    if (!is_method("REGISTER")) return;

    xlog("L_INFO", "REGISTER from $fu (source: $si:$sp)\n");

    if(isflagset(5)) {
        setbflag(6);
    }

    # Forward REGISTER to Asterisk
    $du = "sip:" + ASTERISK_IP + ":" + ASTERISK_PORT;
    
    xlog("L_INFO", "Forwarding REGISTER to Asterisk: $du\n");
    
    route(RELAY);
    exit;
}

# Route to Asterisk server
route[TOASTERISK] {
    xlog("L_INFO", "Routing $rm from $fu (source IP: $si) to Asterisk\n");
    
    # Prevent loop: check if there are multiple Via headers from us
    # If the second Via is also from us, it's a loop
    if ($(hdr(Via)[1]) =~ "c5.sandboxegytelecoms.com") {
        xlog("L_WARN", "LOOP DETECTED: Second Via header is from us - rejecting\n");
        sl_send_reply("482","Loop Detected");
        exit;
    }
    
    # Log SDP content if present
    if(has_body("application/sdp")) {
        xlog("L_INFO", "=== HAS SDP BODY - Will engage RTPEngine ===\n");
        xlog("L_INFO", "SDP Body BEFORE RTPEngine:\n$rb\n");
    } else {
        xlog("L_INFO", "=== NO SDP BODY in $rm - RTPEngine will NOT be engaged ===\n");
    }

    # Force flag 5 to ensure RTPEngine is engaged for all calls
    setflag(5);
    
    # Engage RTPEngine for media handling
    route(NATMANAGE);

    # Set destination to Asterisk (internal VPN IP)
    $du = "sip:" + ASTERISK_IP + ":" + ASTERISK_PORT;
    
    xlog("L_INFO", "Forwarding to Asterisk at $du\n");

    route(RELAY);
    exit;
}

# Caller NAT detection
route[NATDETECT] {
#!ifdef WITH_NAT
    force_rport();
    if (nat_uac_test("19")) {
        if (is_method("REGISTER")) {
            fix_nated_register();
            setbflag(6);
        } else {
            if(is_first_hop()) {
                set_contact_alias();
            }
        }
        setflag(5);
    }
#!endif
    return;
}

# RTPEngine and NAT handling
route[NATMANAGE] {
#!ifdef WITH_NAT
    if (is_request()) {
        if(has_totag()) {
            if(check_route_param("nat=yes")) {
                setbflag(6);
            }
        }
    }
    if (!(isflagset(5) || isbflagset(6))) return;

    if (is_request()) {
        if (!has_totag()) {
            if(t_is_branch_route()) {
                add_rr_param(";nat=yes");
            }
        }
    }
    if (is_reply()) {
        if(isbflagset(6)) {
            if(is_first_hop()) {
                set_contact_alias();
            }
        }
    }

    # Fix NAT in SDP and Contact header
    if (nat_uac_test("8")) {
        fix_nated_sdp("10");
    }
    
    # Fix Contact header for NAT clients
    if (is_request()) {
        fix_nated_contact();
    }

    # RTPEngine engagement for different methods
    if (is_method("INVITE")) {
        if (!has_totag()) {
            # Log original SDP before RTPEngine
            if(has_body("application/sdp")) {
                xlog("L_INFO", "=== ORIGINAL SDP from client BEFORE RTPEngine ===\n$rb\n");
            }
            
            # Initial INVITE with SDP offer
            # Use direction=external internal for proper NAT handling
            if(rtpengine_offer("replace-origin replace-session-connection direction=external:internal ICE=remove RTP/AVP")) {
                xlog("L_INFO", "RTPEngine offer successful\n");
                # Log modified SDP after RTPEngine
                if(has_body("application/sdp")) {
                    xlog("L_INFO", "=== MODIFIED SDP AFTER RTPEngine (to Asterisk) ===\n$rb\n");
                }
            } else {
                xlog("L_ERR", "RTPEngine offer failed\n");
            }
        }
    }
    if (is_method("ACK") && has_body("application/sdp")) {
        rtpengine_answer("replace-origin replace-session-connection direction=internal:external ICE=remove RTP/AVP");
    }
    if (is_method("BYE|CANCEL")) {
        rtpengine_delete();
    }
#!endif
    return;
}

# URI update for dialog requests
route[DLGURI] {
    if($du == "") {
        handle_ruri_alias();
    }
    return;
}

# Relay requests
route[RELAY] {
    # Enable additional event routes for forwarded requests
    if (is_method("INVITE|BYE|SUBSCRIBE|UPDATE")) {
        if(!t_is_set("branch_route")) t_on_branch("MANAGE_BRANCH");
    }
    if (is_method("INVITE|SUBSCRIBE|UPDATE")) {
        if(!t_is_set("onreply_route")) t_on_reply("MANAGE_REPLY");
    }
    if (is_method("INVITE")) {
        if(!t_is_set("failure_route")) t_on_failure("MANAGE_FAILURE");
    }

    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

# Branch route - per branch operations
branch_route[MANAGE_BRANCH] {
    xlog("L_INFO", "New branch [$T_branch_idx] to $ru\n");
    route(NATMANAGE);
}

# Reply route - managing replies
onreply_route[MANAGE_REPLY] {
    xlog("L_INFO", "Incoming reply $rs $rr from Asterisk\n");
    
    # Log SDP in replies from Asterisk
    if(has_body("application/sdp")) {
        xlog("L_INFO", "=== SDP in reply $rs from Asterisk ===\n$rb\n");
    }
    
    # Handle RTPEngine for replies with SDP
    if(status=~"[12][0-9][0-9]") {
        if(has_body("application/sdp")) {
            if(rtpengine_answer("replace-origin replace-session-connection direction=internal:external ICE=remove RTP/AVP")) {
                xlog("L_INFO", "RTPEngine answer successful for reply $rs\n");
                # Log modified SDP after RTPEngine
                if(has_body("application/sdp")) {
                    xlog("L_INFO", "=== MODIFIED SDP AFTER RTPEngine (to client) ===\n$rb\n");
                }
            } else {
                xlog("L_ERR", "RTPEngine answer failed for reply $rs\n");
            }
        }
        route(NATMANAGE);
    }
}

# Failure route - managing failed transactions
failure_route[MANAGE_FAILURE] {
    if (t_is_canceled()) {
        exit;
    }

    # Handle 3xx redirects
    if (t_check_status("3[0-9][0-9]")) {
        t_reply("404","Not found");
        exit;
    }
}